family: pairwise
description: 'Pairwise temporal relation between two events: precedes or co-occurs.'
notes: 'Each group asserts a relation between events A and B over a cohort scope.

  PROP groups assert a value {p} in the claim form.'
common:
  registers:
  - original
  - research
  - media
  - clinical
groups:
- id: P-R1
  primitive: precedes
  level: report
  answer_type: BOOL
  slots:
  - A
  - B
  - r
  variants:
    original:
      question: Did {A} occur before {B} in report {r}?
      claim: In report {r}, {A} occurred before {B}.
    research:
      question: In this report, does {A} precede {B}?
      claim: This report records {A} preceding {B}.
    media:
      question: In this case, did {A} happen before {B}?
      claim: In this case, {A} happened before {B}.
    clinical:
      question: Did {A} come before {B} in this patient?
      claim: In this patient, {A} came before {B}.
- id: P-R2
  primitive: precedes
  level: report
  answer_type: CHOICE
  slots:
  - A
  - B
  - r
  variants:
    original:
      question: Which came first in report {r}, {A} or {B}?
      claim: In report {r}, {A} came first, before {B}.
    research:
      question: Of {A} and {B}, which is the earlier event in this report?
      claim: In this report, {A} is the earlier event.
    media:
      question: In this case, which came first, {A} or {B}?
      claim: In this case, {A} came first.
    clinical:
      question: Between {A} and {B}, which came first in this patient?
      claim: In this patient, {A} came first.
- id: P-V1
  primitive: precedes
  level: vaccine
  answer_type: BOOL
  slots:
  - A
  - B
  - v
  variants:
    original:
      question: Does {A} typically occur before {B} after {v}?
      claim: After {v}, {A} typically occurs before {B}.
    research:
      question: Among {v} reports, does {A} precede {B} in the majority of cases?
      claim: Among {v} reports, {A} precedes {B} in the majority of cases.
    media:
      question: After {v}, do most people get {A} before {B}?
      claim: After {v}, most people get {A} before {B}.
    clinical:
      question: In {v} recipients, does {A} usually come before {B}?
      claim: In {v} recipients, {A} usually comes before {B}.
- id: P-V2
  primitive: precedes
  level: vaccine
  answer_type: BOOL
  slots:
  - A
  - B
  - C
  - v
  variants:
    original:
      question: After {v}, does {B} follow {A} more often than it follows {C}?
      claim: After {v}, {B} follows {A} more often than it follows {C}.
    research:
      question: Among {v} reports, is the rate at which {B} follows {A} higher than the rate at which it follows {C}?
      claim: Among {v} reports, the rate at which {B} follows {A} is higher than the rate at which it follows {C}.
    media:
      question: After {v}, does {B} come after {A} more often than after {C}?
      claim: After {v}, {B} comes after {A} more often than after {C}.
    clinical:
      question: In {v} recipients, does {B} more often follow {A} than {C}?
      claim: In {v} recipients, {B} more often follows {A} than {C}.
- id: P-V3
  primitive: precedes
  level: vaccine
  answer_type: CHOICE
  slots:
  - A
  - B
  - v
  variants:
    original:
      question: After {v}, which usually comes first, {A} or {B}?
      claim: After {v}, {A} usually comes before {B}.
    research:
      question: Among {v} reports with both, which more often precedes the other, {A} or {B}?
      claim: Among {v} reports with both, {A} more often precedes {B}.
    media:
      question: After {v}, which side effect tends to come first, {A} or {B}?
      claim: After {v}, {A} tends to come first.
    clinical:
      question: In {v} patients, what usually shows up first, {A} or {B}?
      claim: In {v} patients, {A} usually shows up first.
- id: P-V4
  primitive: precedes
  level: vaccine
  answer_type: BOOL
  slots:
  - A
  - B
  - C
  - D
  - v
  variants:
    original:
      question: After {v}, does {A} precede {B} more often than {C} precedes {D}?
      claim: After {v}, {A} precedes {B} more often than {C} precedes {D}.
    research:
      question: Among {v} reports, is the {A}-before-{B} rate higher than the {C}-before-{D} rate?
      claim: Among {v} reports, the {A}-before-{B} rate is higher than the {C}-before-{D} rate.
    media:
      question: After {v}, does {A} come before {B} more often than {C} comes before {D}?
      claim: After {v}, {A} comes before {B} more often than {C} comes before {D}.
    clinical:
      question: In {v} recipients, is the {A}-then-{B} order more frequent than the {C}-then-{D} order?
      claim: In {v} recipients, the {A}-then-{B} order is more frequent than the {C}-then-{D} order.
- id: P-M2
  primitive: precedes
  level: multi
  answer_type: CHOICE
  slots:
  - A
  - B
  - v1
  - v2
  variants:
    original:
      question: After which vaccine, {v1} or {v2}, does {A} more often precede {B}?
      claim: '{A} precedes {B} more often after {v1} than after {v2}.'
    research:
      question: Between {v1} and {v2}, which cohort shows a higher {A}-preceding-{B} proportion?
      claim: '{v1} shows a higher {A}-precedes-{B} proportion than {v2}.'
    media:
      question: Is {A}-before-{B} more common after {v1} or {v2}?
      claim: '{A}-before-{B} is more common after {v1} than {v2}.'
    clinical:
      question: In which group is {A} more often the precursor to {B}, {v1} or {v2} recipients?
      claim: '{v1} recipients more often have {A} as a precursor to {B}.'
- id: C-R1
  primitive: co_occurs
  level: report
  answer_type: BOOL
  slots:
  - A
  - B
  - r
  variants:
    original:
      question: Do {A} and {B} co-occur in report {r}?
      claim: In report {r}, {A} and {B} co-occur.
    research:
      question: In this report, are {A} and {B} concurrent?
      claim: In this report, {A} and {B} are concurrent.
    media:
      question: In this case, did {A} and {B} happen at the same time?
      claim: In this case, {A} and {B} happened at the same time.
    clinical:
      question: Did this patient have {A} and {B} together?
      claim: This patient had {A} and {B} together.
- id: C-V1
  primitive: co_occurs
  level: vaccine
  answer_type: BOOL
  slots:
  - A
  - B
  - v
  variants:
    original:
      question: Do {A} and {B} typically co-occur after {v}?
      claim: After {v}, {A} and {B} typically co-occur.
      question_negated: Is it the case that {A} and {B} do NOT typically co-occur after {v}?
      claim_negated: After {v}, {A} and {B} do not typically co-occur.
    research:
      question: In {v} reports, are {A} and {B} concurrent in the majority of cases?
      claim: In {v} reports, {A} and {B} are concurrent in the majority of cases.
      question_negated: In {v} reports, are {A} and {B} concurrent in a minority of cases?
      claim_negated: In {v} reports, {A} and {B} are NOT concurrent in the majority of cases.
    media:
      question: After {v}, do {A} and {B} usually show up together?
      claim: After {v}, {A} and {B} usually show up together.
      question_negated: After {v}, is it true that {A} and {B} usually do NOT show up together?
      claim_negated: After {v}, {A} and {B} usually do not show up together.
    clinical:
      question: In {v} recipients, do {A} and {B} typically present together?
      claim: In {v} recipients, {A} and {B} typically present together.
      question_negated: In {v} recipients, is it the case that {A} and {B} do NOT typically present together?
      claim_negated: In {v} recipients, {A} and {B} do not typically present together.
- id: C-V2
  primitive: co_occurs
  level: vaccine
  answer_type: BOOL
  slots:
  - A
  - B
  - v
  variants:
    original:
      question: After {v}, do {A} and {B} occur together more often than their separate rates would predict?
      claim: After {v}, {A} and {B} occur together more often than their separate rates would predict.
      question_negated: After {v}, is it the case that {A} and {B} do NOT occur together more often than their separate rates would predict?
      claim_negated: After {v}, {A} and {B} do not occur together more often than their separate rates would predict.
    research:
      question: Among {v} reports, is {B} more prevalent in reports containing {A} than in reports without it?
      claim: Among {v} reports, {B} is more prevalent in reports containing {A} than in reports without it.
      question_negated: Among {v} reports, is {B} no more prevalent in reports containing {A} than in reports without it?
      claim_negated: Among {v} reports, {B} is not more prevalent in reports containing {A} than in reports without it.
    media:
      question: After {v}, do people who report {A} also report {B} more often than everyone else does?
      claim: After {v}, people who report {A} also report {B} more often than everyone else does.
      question_negated: After {v}, do people who report {A} report {B} no more often than everyone else does?
      claim_negated: After {v}, people who report {A} do not report {B} more often than everyone else does.
    clinical:
      question: In {v} recipients, is {A} associated with {B} beyond what their individual frequencies imply?
      claim: In {v} recipients, {A} is associated with {B} beyond what their individual frequencies imply.
      question_negated: In {v} recipients, is {A} unassociated with {B} once their individual frequencies are accounted for?
      claim_negated: In {v} recipients, {A} is not associated with {B} beyond what their individual frequencies imply.
- id: C-V3
  primitive: co_occurs
  level: vaccine
  answer_type: BOOL
  slots:
  - A
  - B
  - v
  variants:
    original:
      question: After {v}, is co-occurrence the dominant relation for {A} and {B}?
      claim: After {v}, co-occurrence is the dominant relation for {A} and {B}.
      question_negated: After {v}, is co-occurrence NOT the dominant relation for {A} and {B}?
      claim_negated: After {v}, co-occurrence is not the dominant relation for {A} and {B}.
    research:
      question: Among {v} reports with both events, is concurrent presentation the most common relation?
      claim: Among {v} reports with both events, concurrent presentation is the most common relation.
      question_negated: Among {v} reports with both events, is concurrent presentation NOT the most common relation?
      claim_negated: Among {v} reports with both events, concurrent presentation is not the most common relation.
    media:
      question: After {v}, do {A} and {B} show up together more often than in either order?
      claim: After {v}, {A} and {B} show up together more often than in either order.
      question_negated: After {v}, is it the case that {A} and {B} do NOT show up together more often than in either order?
      claim_negated: After {v}, {A} and {B} do not show up together more often than in either order.
    clinical:
      question: In {v} recipients with both, is concurrence the most common presentation?
      claim: In {v} recipients with both, concurrence is the most common presentation.
      question_negated: In {v} recipients with both, is concurrence NOT the most common presentation?
      claim_negated: In {v} recipients with both, concurrence is not the most common presentation.
