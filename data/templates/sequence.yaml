family: sequence
description: Ordering of three events.
notes: 'Strict ordering: {A} → {B} → {C} requires level_of(A) < level_of(B) < level_of(C). Co-occurrence within the sequence
  does not satisfy strict ordering. Denominator is restricted to reports containing all three events.'
common:
  registers:
  - original
  - research
  - media
  - clinical
groups:
- id: S-R1
  primitive: sequence
  level: report
  answer_type: BOOL
  slots:
  - A
  - B
  - C
  - r
  variants:
    original:
      question: Do {A}, {B}, {C} occur in the order {A} → {B} → {C} in report {r}?
      claim: In report {r}, {A}, {B}, {C} occur in the order {A} → {B} → {C}.
    research:
      question: In this report, is the observed ordering of {A}, {B}, {C} exactly {A} → {B} → {C}?
      claim: In this report, the observed ordering is {A} → {B} → {C}.
    media:
      question: In this case, did things go {A}, then {B}, then {C}?
      claim: In this case, the progression was {A}, then {B}, then {C}.
    clinical:
      question: Did this patient progress {A}, then {B}, then {C}?
      claim: This patient progressed {A} → {B} → {C}.
- id: S-V1
  primitive: sequence
  level: vaccine
  answer_type: BOOL
  slots:
  - A
  - B
  - C
  - v
  variants:
    original:
      question: After {v}, is {A} → {B} → {C} the most common ordering of {A}, {B}, {C}?
      claim: After {v}, {A} → {B} → {C} is the most common ordering of {A}, {B}, {C}.
    research:
      question: In {v} reports with all three events, is {A} → {B} → {C} the single most frequent ordering?
      claim: In {v} reports with all three, {A} → {B} → {C} is the single most frequent ordering.
    media:
      question: After {v}, is {A}, then {B}, then {C} the most common order?
      claim: After {v}, {A}, then {B}, then {C} is the most common order.
    clinical:
      question: In {v} recipients with all three, is {A} → {B} → {C} the most frequent progression?
      claim: In {v} recipients with all three, {A} → {B} → {C} is the most frequent progression.
- id: S-V3
  primitive: sequence
  level: vaccine
  answer_type: CHOICE
  slots:
  - A
  - B
  - C
  - v
  variants:
    original:
      question: After {v}, what is the most common ordering of {A}, {B}, {C}?
      claim: After {v}, the most common ordering of {A}, {B}, {C} is {A} → {B} → {C}.
    research:
      question: Among {v} reports with all three events, what is the modal ordering of {A}, {B}, {C}?
      claim: Among {v} reports with all three, the modal ordering is {A} → {B} → {C}.
    media:
      question: After {v}, what's the most common order people experience {A}, {B}, and {C}?
      claim: After {v}, the most common order is {A} → {B} → {C}.
    clinical:
      question: What's the most common progression of {A}, {B}, {C} in {v} patients?
      claim: The most common progression in {v} patients is {A} → {B} → {C}.
- id: S-V4
  primitive: sequence
  level: vaccine
  answer_type: BOOL
  slots:
  - A
  - B
  - C
  - v
  variants:
    original:
      question: After {v}, is the ordering of {A}, {B}, {C} consistent across reports?
      claim: After {v}, the ordering of {A}, {B}, {C} is consistent across reports.
    research:
      question: In {v} reports with all three, does a single ordering dominate across cases?
      claim: In {v} reports with all three, a single ordering of {A}, {B}, {C} dominates.
    media:
      question: After {v}, do people usually experience {A}, {B}, {C} in the same order?
      claim: After {v}, people usually experience {A}, {B}, {C} in the same order.
    clinical:
      question: In {v} patients, is the progression of {A}, {B}, {C} consistent across cases?
      claim: In {v} patients, the progression of {A}, {B}, {C} is consistent.
- id: S-M1
  primitive: sequence
  level: multi
  answer_type: BOOL
  slots:
  - A
  - B
  - C
  - v1
  - v2
  variants:
    original:
      question: Does the {A} → {B} → {C} rate differ between {v1} and {v2}?
      claim: The {A} → {B} → {C} rate differs between {v1} and {v2}.
    research:
      question: Among reports with all three events, is the {A} → {B} → {C} proportion different between {v1} and {v2}?
      claim: The {A} → {B} → {C} proportion differs between {v1} and {v2}.
    media:
      question: Is there a real difference between {v1} and {v2} in how often things go {A} → {B} → {C}?
      claim: '{v1} and {v2} differ in how often things go {A} → {B} → {C}.'
    clinical:
      question: Do {v1} and {v2} patients differ in how often they follow {A} → {B} → {C}?
      claim: '{v1} and {v2} recipients differ in the {A} → {B} → {C} rate.'
- id: S-M2
  primitive: sequence
  level: multi
  answer_type: CHOICE
  slots:
  - A
  - B
  - C
  - v1
  - v2
  variants:
    original:
      question: Is the sequence {A} → {B} → {C} more common after {v1} or {v2}?
      claim: The sequence {A} → {B} → {C} is more common after {v1} than {v2}.
    research:
      question: Between {v1} and {v2}, which cohort shows a higher proportion of {A} → {B} → {C}?
      claim: '{v1} shows a higher proportion of {A} → {B} → {C} than {v2}.'
    media:
      question: Is {A} → {B} → {C} more common after {v1} or {v2}?
      claim: '{A} → {B} → {C} is more common after {v1} than {v2}.'
    clinical:
      question: In which group is {A} → {B} → {C} more common, {v1} or {v2} recipients?
      claim: '{A} → {B} → {C} is more common in {v1} recipients.'
- id: S-M3
  primitive: sequence
  level: multi
  answer_type: BOOL
  slots:
  - A
  - B
  - C
  - v1
  - v2
  variants:
    original:
      question: Is the typical ordering of {A}, {B}, {C} the same after {v1} and {v2}?
      claim: The typical ordering of {A}, {B}, {C} is the same after {v1} and {v2}.
    research:
      question: Is the modal ordering of {A}, {B}, {C} the same between {v1} and {v2} cohorts?
      claim: The modal ordering of {A}, {B}, {C} is the same in {v1} and {v2} cohorts.
    media:
      question: Do {v1} and {v2} produce the same typical order of {A}, {B}, {C}?
      claim: '{v1} and {v2} produce the same typical order of {A}, {B}, {C}.'
    clinical:
      question: Is the typical progression of {A}, {B}, {C} the same in {v1} and {v2} recipients?
      claim: The typical progression of {A}, {B}, {C} is the same in {v1} and {v2} recipients.
