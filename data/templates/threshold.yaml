family: threshold
description: 'v1.2 (decisions.md 2026-10-07/08, issue 32): claims that name a STRENGTH bar; the null is read off
  the text (null_ref). Tested per orientation (refuted = significantly BELOW the bar), so a core yields one instance,
  not a mirror pair. Wording is inferential (a rate in a population), never a count over the dataset.'
common:
  registers:
  - original
  - research
  - media
  - clinical
groups:
- id: H-V1
  primitive: precedes
  level: vaccine
  answer_type: BOOL
  null_ref: 0.667
  slots:
  - A
  - B
  - v
  variants:
    original:
      question: After {v}, does {A} tend to precede {B} in at least two out of three cases where their order is
        recorded?
      claim: After {v}, {A} tends to precede {B} in at least two out of three cases where their order is recorded.
    research:
      question: Among {v} recipients with {A} and {B} at distinct stages, is the rate of {A} preceding {B} at least
        two thirds?
      claim: Among {v} recipients with {A} and {B} at distinct stages, the rate of {A} preceding {B} is at least
        two thirds.
    media:
      question: After {v}, when {A} and {B} don't happen at the same time, does {A} tend to come first at least
        two times in three?
      claim: After {v}, when {A} and {B} don't happen at the same time, {A} tends to come first at least two times
        in three.
    clinical:
      question: In {v} recipients with a documented order of {A} and {B}, does {A} tend to precede {B} in two thirds
        or more of cases?
      claim: In {v} recipients with a documented order of {A} and {B}, {A} tends to precede {B} in two thirds or
        more of cases.
  notes: 'Review 2026-10-08: inferential wording -- ''tends to'' / ''the rate ... is'' with the bar stated as the
    only number; never ''typically''/''usually'' (one half in this dataset). Positive wording only: refuted = significantly
    below the bar.'
- id: H-V3
  primitive: co_occurs
  level: vaccine
  answer_type: BOOL
  null_ref: 0.667
  slots:
  - A
  - B
  - v
  variants:
    original:
      question: After {v}, do {A} and {B} tend to occur at the same stage in at least two out of three cases where
        both occur?
      claim: After {v}, {A} and {B} tend to occur at the same stage in at least two out of three cases where both
        occur.
    research:
      question: Among {v} recipients experiencing both {A} and {B}, is the rate of same-stage co-occurrence at least
        two thirds?
      claim: Among {v} recipients experiencing both {A} and {B}, the rate of same-stage co-occurrence is at least
        two thirds.
    media:
      question: After {v}, when someone gets both {A} and {B}, do the two tend to come together at least two times
        in three?
      claim: After {v}, when someone gets both {A} and {B}, the two tend to come together at least two times in
        three.
    clinical:
      question: In {v} recipients presenting with both {A} and {B}, does concurrent onset tend to occur in two thirds
        or more of cases?
      claim: In {v} recipients presenting with both {A} and {B}, concurrent onset tends to occur in two thirds or
        more of cases.
  notes: 'Review 2026-10-08: inferential wording -- ''tends to'' / ''the rate ... is'' with the bar stated as the
    only number; never ''typically''/''usually'' (one half in this dataset). Positive wording only: refuted = significantly
    below the bar.'
- id: H-V5
  primitive: first_last
  level: vaccine
  answer_type: BOOL
  null_ref: 0.5
  slots:
  - A
  - B
  - C
  - v
  notes: 'Review 2026-10-08: inferential wording -- ''tends to'' / ''the rate ... is'' with the bar stated as the
    only number; never ''typically''/''usually'' (one half in this dataset). Positive wording only: refuted = significantly
    below the bar.'
  variants:
    original:
      question: After {v}, does {A} tend to be the first of {A}, {B} and {C} in at least half of cases?
      claim: After {v}, {A} tends to be the first of {A}, {B} and {C} in at least half of cases.
    research:
      question: Among {v} recipients experiencing {A}, {B} and {C}, is the rate at which {A} is the earliest of
        the three at least 50%?
      claim: Among {v} recipients experiencing {A}, {B} and {C}, the rate at which {A} is the earliest of the three
        is at least 50%.
    media:
      question: After {v}, when someone gets {A}, {B} and {C}, does {A} tend to come first at least half the time?
      claim: After {v}, when someone gets {A}, {B} and {C}, {A} tends to come first at least half the time.
    clinical:
      question: In {v} recipients presenting {A}, {B} and {C}, does {A} tend to be the initial feature in half or
        more of cases?
      claim: In {v} recipients presenting {A}, {B} and {C}, {A} tends to be the initial feature in half or more
        of cases.
