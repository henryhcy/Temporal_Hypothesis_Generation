family: stratified
status: candidate-REJECTED
description: 'Two-cohort temporal contrasts where the cohorts are PATIENT strata --
  age band, sex -- instead of vaccine brand.'
notes: 'THE GAP THIS FILLS, in principle. The two-cohort tier is the weakest part of
  the benchmark: it is down to one group (P-M2) because C-M2 and F-M3 failed their
  permutation nulls and no substitute cleared. The stated diagnosis was cohort SIZE
  -- conditioning two named events on co-presence inside a ~1,000-report vaccine
  cohort leaves n ~ 10-30 a side. If that diagnosis were right, splitting on
  something that divides the corpus more evenly should rescue the tier.

  The VAERS csv carries age and sex for all 3,166 reports (the DB build dropped
  both). Age at the median splits 1,501 / 1,536 -- more evenly than vaccine''s
  1,164 / 1,019 / 983, and each band is larger than any vaccine cohort. Age also
  needs ONE comparison per event pair where vaccine needs three, which removes the
  core dependence that inflates the vaccine null. Sex splits 2,219 F / 921 M.

  MEASURED RESULT: REJECTED. Seven shapes were screened (2026-08-14) and not one
  clears its label-permutation null. See `docs/plan/10_family_expansion.md` for the
  table. The finding is stronger than "underpowered": age-band position produced 2
  supported against 15 refuted, and age-quartile extremes (<=35 vs >=63, the largest
  contrast the corpus can make) produced 5 decisive cores of 59 against a null mean
  of 3.8.

  WHY THIS MATTERS EVEN THOUGH IT FAILED. It refutes the size diagnosis. Age at the
  median gives MORE cores than vaccine does (211 vs 322-over-three-comparisons, so
  ~2x per comparison) and still finds nothing, so the two-cohort tier is not thin
  because the cohorts are small -- it is thin because SYMPTOM ORDER genuinely does
  not vary much across patient strata. That reframes P-M2''s pass as a real and
  fairly remarkable finding rather than the one survivor of a power problem, and it
  closes off "split on something else" as a rescue route for issue 1.

  These groups are recorded, not shipped. Do not adopt without a new measurement.'
common:
  registers: [original, research, media, clinical]
groups:
- id: G-A1
  primitive: precedes
  level: stratum
  answer_type: BOOL
  contrast: age_median
  slots: [A, B]
  screened: 'p_sup fails; see 10_family_expansion.md'
  variants:
    original:
      question: Does {A} precede {B} more often in patients under 50 than in patients
        50 and older?
      claim: '{A} precedes {B} more often in patients under 50 than in patients
        50 and older.'
    research:
      question: Is the {A}-before-{B} rate higher in the under-50 stratum than in the
        50-and-over stratum?
      claim: The {A}-before-{B} rate is higher in the under-50 stratum than in the 50-and-over
        stratum.
    media:
      question: Do younger patients get {A} before {B} more often than older patients
        do?
      claim: Younger patients get {A} before {B} more often than older patients do.
    clinical:
      question: In patients under 50, does {A} precede {B} more often than in those 50
        and over?
      claim: In patients under 50, {A} precedes {B} more often than in those 50 and over.
